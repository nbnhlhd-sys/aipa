yamlname: 自动同步 Streamlit 数据

on:
  schedule:
    - cron: '0 * * * *'  # 每小时自动同步一次（可根据需要修改）
  workflow_dispatch:     # 允许你在 GitHub 网页上随时手动点击按钮同步

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 赋予写权限，以便把数据推回仓库

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 从 Streamlit 服务器拉取最新数据库
      run: |
        # 这里的链接是你的 Streamlit 应用对外提供下载的默认静态地址
        # 如果你的 default.db 平时没有做静态暴露，这里会尝试抓取当前运行的运行时母本
        curl -L -o default.db "https://nbnhlhdaipa.streamlit.app" || curl -L -o default.db "https://nbnhlhdaipa.streamlit.app"

    - name: 提交并推送到 GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        git add default.db
        if ! git diff-index --quiet HEAD --; then
          git commit -m "chore: 自动同步 Streamlit 最新数据 [skip ci]"
          git push origin main
        else
          echo "数据没有变化，无需同步。"
